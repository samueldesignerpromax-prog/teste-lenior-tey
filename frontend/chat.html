<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chat · LENIOR</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/chat.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧠</text></svg>" />
</head>
<body>
  <div class="chat-container">
    <header class="chat-header">
      <a href="index.html" class="btn-back">← Voltar</a>
      <div class="chat-title">
        <span class="logo-icon">🧠</span>
        <span>LENIOR</span>
      </div>
      <button id="clearChat" class="btn-clear" title="Limpar histórico">🗑️</button>
    </header>

    <div class="chat-messages" id="chatMessages"></div>

    <div id="loadingIndicator" class="loading-indicator" style="display: none;">
      <span class="spinner"></span> LENIOR está pensando...
    </div>

    <div class="chat-input-area">
      <input type="text" id="messageInput" placeholder="Digite sua mensagem..." autofocus />
      <button id="sendButton" class="btn-send">Enviar</button>
    </div>
  </div>

  <script src="js/chat.js"></script>
</body>
</html>
